server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        # Unknown paths are client-side routes, so serve index.html.
        try_files $uri /index.html;
    }

    location /api/ {
        # "backend" is the compose service name. Same as the Vite dev proxy.
        proxy_pass http://backend:8080;
    }
}
