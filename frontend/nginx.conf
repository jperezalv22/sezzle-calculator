server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        # Single-page app: a path the server does not have is a client-side
        # route, so it falls back to index.html rather than returning a 404.
        try_files $uri /index.html;
    }

    location /api/ {
        # "backend" is the compose service name, resolved on the compose
        # network. This mirrors the Vite dev proxy so the frontend uses
        # relative /api URLs in both environments.
        proxy_pass http://backend:8080;
    }
}
