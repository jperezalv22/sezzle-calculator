services:
  backend:
    build: ./backend
    # Only nginx reaches it. Add a ports entry to call the API directly.
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 3000, not 8080, so it can run next to a local backend.
      - "${HOST_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
