services:
  backend:
    build: ./backend
    # Only nginx reaches it. Add a ports entry to call the API directly.
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # If 8080 is taken: `HOST_PORT=8090 docker compose up`.
      - "${HOST_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
